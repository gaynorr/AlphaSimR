# Codecov configuration for AlphaSimR
#
# Coverage is produced by .github/workflows/test-coverage.yaml, which runs
# covr::package_coverage() and uploads a Cobertura report. Uploading needs a
# CODECOV_TOKEN repository secret; see the Codecov docs for adding one.
#
# Reference: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "50...90"

  status:
    # Both checks are informational: they report a number on the pull
    # request but never mark it failed. AlphaSimR is a mature package that
    # is only now gaining coverage reporting, so a dip should be visible
    # without blocking a merge. Remove "informational" to enforce them.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  # Stay quiet on pull requests that do not move coverage
  require_changes: true

ignore:
  # Third party code: the Markovian Coalescent Simulator (MaCS) by Gary K.
  # Chen, vendored under the Apache License 2.0. The file list here is the
  # one given in LICENSE.note. It is exercised through runMacs rather than
  # by tests written against it, so counting it measures the wrong thing.
  - "src/algorithm.cpp"
  - "src/constants.h"
  - "src/datastructures.cpp"
  - "src/simulator.cpp"
  - "src/simulator.h"

  # Generated by Rcpp::compileAttributes(), not written by hand
  - "R/RcppExports.R"
  - "src/RcppExports.cpp"

  # The tests themselves, and files that are not package sources
  - "tests/**/*"
  - "vignettes/**/*"
  - "inst/**/*"
