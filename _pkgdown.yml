url: https://gaynorr.github.io/AlphaSimR/
template:
  bootstrap: 5

reference:
- title: Simulation parameters
  desc: >
    The global settings object that holds the genetic map, traits and
    the simulation's bookkeeping.
  contents:
  - SimParam
  - getNumThreads
  - isOpenMPAvailable

- title: SimParam methods
  desc: >
    Methods called on a SimParam object, as in `SP$addTraitA()`, in the
    order of the overview on the SimParam page.
  contents:
  - SimParam-setSexes
  - SimParam-setTrackPed
  - SimParam-setTrackRec
  - SimParam-resetPed
  - SimParam-addTraitA
  - SimParam-addTraitAD
  - SimParam-addTraitAE
  - SimParam-addTraitADE
  - SimParam-addTraitAG
  - SimParam-addTraitADG
  - SimParam-addTraitAEG
  - SimParam-addTraitADEG
  - SimParam-altAddTraitAD
  - SimParam-manAddTrait
  - SimParam-importTrait
  - SimParam-setVarE
  - SimParam-setCorE
  - SimParam-restrSegSites
  - SimParam-addSnpChip
  - SimParam-addSnpChipByName
  - SimParam-addStructuredSnpChip
  - SimParam-setFounderHap
  - SimParam-setRecombRatio
  - SimParam-switchGenMap
  - SimParam-switchFemaleMap
  - SimParam-switchMaleMap
  - SimParam-switchTrait
  - SimParam-removeTrait
  - SimParam-rescaleTraits

- title: Founder genomes
  desc: >
