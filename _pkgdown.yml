  - newMultiPop
  - newEmptyMultiPop
  - mergePops
  - mergeMultiPops
  - splitPop
  - flattenMultiPop
  - unnameMultiPop
  - resetPop
  - attrition
  - isPop
  - nInd
  - nPop
